# Checks every proposed change. Saves from the editor that pass are published automatically.
# Anything that fails stays off the live site and the owner is emailed.
name: Review

on:
  push:
    branches: [edits, "code/**"]
  workflow_dispatch:
  pull_request:
    branches: [production]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Get the trusted checker from production
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production
          path: trusted
          persist-credentials: false
      - name: Get the proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.node-version
      - name: Check the content
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$HEAD_REF" = "edits" ]; then
            node trusted/scripts/validate-content.mjs candidate
          else
            node candidate/scripts/validate-content.mjs candidate
          fi
      - name: Edits may only change content and photos
        if: ${{ (github.head_ref || github.ref_name) == 'edits' }}
        working-directory: candidate
        run: |
          git fetch --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" production
          outside=$(git diff --name-only FETCH_HEAD...HEAD | grep -Ev '^(content/site/[^/]+\.json|public/assets/img/.+)$' || true)
          if [ -n "$outside" ]; then
            echo "These files cannot be changed from the edits branch:"
            echo "$outside"
            exit 1
          fi

  open-pull-request:
    needs: validate
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Open a pull request if there is none
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          open=$(gh pr list -R "$REPO" --head "$BRANCH" --base production --state open --json number --jq '.[0].number // empty')
          [ -n "$open" ] && exit 0
          ahead=$(gh api "repos/$REPO/compare/production...$BRANCH" --jq .ahead_by)
          [ "$ahead" = "0" ] && exit 0
          body="Changes from \`$BRANCH\`. Saves from the editor publish automatically once the checks pass."
          gh pr create -R "$REPO" --base production --head "$BRANCH" --title "Review changes from $BRANCH" --body "$body"

      - name: Publish a save that passed the checks
        if: ${{ github.ref_name == 'edits' && needs.validate.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Publish sends one commit per section. Wait, so only the last one deploys.
          sleep 60
          number=$(gh pr list -R "$REPO" --head edits --base production --state open --json number --jq '.[0].number // empty')
          [ -z "$number" ] && exit 0
          # A newer save has its own run, which will publish it.
          head=$(gh pr view "$number" -R "$REPO" --json headRefOid --jq .headRefOid)
          [ "$head" = "$GITHUB_SHA" ] || exit 0
          gh pr merge "$number" -R "$REPO" --merge --match-head-commit "$GITHUB_SHA"
          # Merges made with this token do not start other workflows on their own.
          gh workflow run production.yml -R "$REPO" --ref production

      - name: Tell the owner a save could not be published
        if: ${{ github.ref_name == 'edits' && needs.validate.result != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh pr list -R "$REPO" --head edits --base production --state open --json number --jq '.[0].number // empty')
          [ -n "$number" ] && gh pr comment "$number" -R "$REPO" --body "@$OWNER this save failed the checks and was **not published**. The live site is unchanged. Details: $RUN"
